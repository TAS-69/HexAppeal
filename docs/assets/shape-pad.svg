<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" role="img" aria-labelledby="title desc"><title id="title">The shape pad</title><desc id="desc">Vertical controls Top. Horizontal controls Bottom. Nine detents combine Hex, Venus and Flat. Height and Weight are separate.</desc><defs><linearGradient id="pad" x2="1" y2="1"><stop stop-color="#8c2d68"/><stop offset=".5" stop-color="#532a68"/><stop offset="1" stop-color="#26334f"/></linearGradient></defs><rect width="960" height="740" rx="24" fill="#1b1323"/><g font-family="Segoe UI,Arial,sans-serif" fill="#f4e8d5"><text x="48" y="61" font-size="27" font-weight="700" letter-spacing="3">ONE PAD. NINE ANCHORS.</text><text x="48" y="92" font-size="17" fill="#dba5c0">Drag between them for a blend. Buttons set one axis exactly.</text><rect x="190" y="140" width="580" height="390" rx="6" fill="url(#pad)" stroke="#dcba88" stroke-width="2"/><path d="M480 140V530M190 335H770" stroke="#e7d3df" stroke-opacity=".26" stroke-dasharray="5 8"/><text x="47" y="330" font-size="18" font-weight="700" fill="#edc98f">TOP</text><text x="480" y="575" text-anchor="middle" font-size="18" font-weight="700" fill="#edc98f">BOTTOM → HEX · VENUS · FLAT</text><text x="172" y="166" text-anchor="end" font-size="15" fill="#efc8dc">HEX</text><text x="172" y="341" text-anchor="end" font-size="15" fill="#efc8dc">VENUS</text><text x="172" y="516" text-anchor="end" font-size="15" fill="#efc8dc">FLAT</text><circle cx="215" cy="165" r="5" fill="#f4d49f"/><text x="215" y="192" text-anchor="start" font-size="15" font-weight="600">HEX / HEX</text><circle cx="480" cy="165" r="5" fill="#f4d49f"/><text x="480" y="192" text-anchor="middle" font-size="15" font-weight="600">HEX / VENUS</text><circle cx="745" cy="165" r="5" fill="#f4d49f"/><text x="745" y="192" text-anchor="end" font-size="15" font-weight="600">HEX / FLAT</text><circle cx="215" cy="335" r="5" fill="#f4d49f"/><text x="215" y="318" text-anchor="start" font-size="15" font-weight="600">VENUS / HEX</text><circle cx="480" cy="335" r="5" fill="#f4d49f"/><text x="480" y="318" text-anchor="middle" font-size="15" font-weight="600">VENUS / VENUS</text><circle cx="745" cy="335" r="5" fill="#f4d49f"/><text x="745" y="318" text-anchor="end" font-size="15" font-weight="600">VENUS / FLAT</text><circle cx="215" cy="505" r="5" fill="#f4d49f"/><text x="215" y="488" text-anchor="start" font-size="15" font-weight="600">FLAT / HEX</text><circle cx="480" cy="505" r="5" fill="#f4d49f"/><text x="480" y="488" text-anchor="middle" font-size="15" font-weight="600">FLAT / VENUS</text><circle cx="745" cy="505" r="5" fill="#f4d49f"/><text x="745" y="488" text-anchor="end" font-size="15" font-weight="600">FLAT / FLAT</text><circle cx="408" cy="385" r="11" fill="none" stroke="#fff1d4" stroke-width="3"/><circle cx="408" cy="385" r="4" fill="#fff1d4"/><rect x="48" y="612" width="414" height="82" rx="12" fill="#302039"/><rect x="482" y="612" width="430" height="82" rx="12" fill="#302039"/><text x="70" y="641" font-size="18" font-weight="700">HEIGHT</text><path d="M180 648H430" stroke="#b888af" stroke-width="5"/><circle cx="270" cy="648" r="8" fill="#efc98c"/><text x="70" y="676" font-size="14" fill="#dcc5d8">Independent full-rig scale</text><text x="506" y="641" font-size="18" font-weight="700">WEIGHT</text><path d="M620 648H880" stroke="#b888af" stroke-width="5"/><circle cx="810" cy="648" r="8" fill="#df71a9"/><text x="506" y="676" font-size="14" fill="#dcc5d8">Independent limbs / waist · optional reference</text></g></svg>