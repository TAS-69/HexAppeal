<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" role="img" aria-labelledby="title desc"><title id="title">External outfits and Wardrobe</title><desc id="desc">An outfit mod retains its own mounted assets. Its provider registers options in Wardrobe. Saved effective choices return to the provider or checked native parts.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#efc98c"/></marker></defs><rect width="1040" height="440" rx="24" fill="#1b1323"/><g font-family="Segoe UI,Arial,sans-serif" fill="#f4e8d5"><text x="40" y="55" font-size="26" font-weight="700" letter-spacing="2">YOUR OUTFIT. SHARED WARDROBE.</text><text x="40" y="89" font-size="17" fill="#dba5c0">Assets stay in the outfit mod. The menu and saved choices live here.</text><rect x="40" y="135" width="260" height="174" rx="14" fill="#33203e" stroke="#b85d92"/><text x="60" y="172" font-size="19" font-weight="700" fill="#efc98c">OUTFIT MOD</text><text x="60" y="211" font-size="16">Own mounted assets</text><text x="60" y="240" font-size="16">Actual prefab / part keys</text><text x="60" y="269" font-size="16">Own provider plugin</text><rect x="390" y="135" width="260" height="174" rx="14" fill="#33203e" stroke="#b85d92"/><text x="410" y="172" font-size="19" font-weight="700" fill="#efc98c">REGISTRATION</text><text x="410" y="211" font-size="16">Real outfit name</text><text x="410" y="240" font-size="16">Supported controls</text><text x="410" y="269" font-size="16">Availability + stable IDs</text><rect x="740" y="135" width="260" height="174" rx="14" fill="#33203e" stroke="#b85d92"/><text x="760" y="172" font-size="19" font-weight="700" fill="#efc98c">WARDROBE</text><text x="760" y="211" font-size="16">Witch / All targeting</text><text x="760" y="240" font-size="16">Saved choices + pins</text><text x="760" y="269" font-size="16">Effective underwear policy</text><path d="M308 223H378M658 223H728" fill="none" stroke="#efc98c" stroke-width="2" marker-end="url(#arrow)"/><path d="M870 321V367H170V321" fill="none" stroke="#efc98c" stroke-width="2" marker-end="url(#arrow)"/><rect x="263" y="348" width="515" height="38" rx="8" fill="#1b1323"/><text x="520" y="373" text-anchor="middle" font-size="16" fill="#f4d3e4">Apply effective choices through native parts or your renderer</text><text x="40" y="417" font-size="14" fill="#cbb6cb">API registration supplies controls. Correct skin, materials, rigging and cloth still belong to the outfit.</text></g></svg>